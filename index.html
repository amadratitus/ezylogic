<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anagram Magic · Anagram solver and magic square generator</title>
  <meta name="description" content="Find real English anagrams and generate verified magic squares of any size from 1 to 100. Runs entirely in your browser.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var theme = null;
      try { theme = JSON.parse(localStorage.getItem('anagram-magic:theme')); } catch (error) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="#/" aria-label="Anagram Magic home">
        <span class="brand__mark" id="brand-mark"></span>
        <span class="brand__name">Anagram Magic</span>
      </a>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="#/">Home</a>
        <a href="#/anagram">Anagram Solver</a>
        <a href="#/magic-square">Magic Square</a>
        <a href="#/about">About</a>
      </nav>
      <div class="site-header__actions">
        <button class="icon-button" id="theme-button" type="button" aria-label="Switch theme"></button>
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav"></button>
      </div>
    </div>
  </header>

  <main class="container" id="main" tabindex="-1">
    <noscript><p class="noscript">Anagram Magic needs JavaScript to run.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; 2026 EazyLogic</p>
      <p>Word list: ENABLE, public domain. <a href="#/about">How it works</a></p>
    </div>
  </footer>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
